services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodleap
      POSTGRES_USER: foodleap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodleap_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodleap -d foodleap"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [foodleap]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [foodleap]
    restart: unless-stopped

networks:
  foodleap:
    driver: bridge

volumes:
  pgdata:
  redisdata:
