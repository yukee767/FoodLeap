name = "foodleap-web"
compatibility_date = "2025-08-21"
compatibility_flags = ["nodejs_compat"]

# OpenNext build output
# Worker entry - generated by opennextjs-cloudflare
# main = ".open-next/worker.js" # auto-set by opennext

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability.logs]
enabled = true

[vars]
# Public env - set via dashboard or .dev.vars for local
# API URLs - in prod point to Workers below, in dev localhost
API_MAIN_URL = "https://foodleap-api.victorlima124tt.workers.dev"
SEARCH_SERVICE_URL = "https://foodleap-search.victorlima124tt.workers.dev"
