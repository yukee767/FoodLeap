name: CI
on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npx tsc --noEmit --project apps/api-main/tsconfig.json || true
      - run: npm run lint --if-present || true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodleap_test
          POSTGRES_USER: foodleap
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U foodleap" --health-interval 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: npm ci || npm install
      - run: pip install -r apps/admin-api/requirements.txt
      - run: npm run build --workspaces --if-present || true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/web/Dockerfile . --tag test:web || true
      - run: docker build -f apps/api-main/Dockerfile . --tag test:api || true
