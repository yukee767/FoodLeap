name: Deploy Cloudflare
on:
  push:
    branches: [main, master]
    paths: ["apps/api-main/**","apps/search-service/**","apps/web/**","packages/**","infra/cloudflare/**",".github/workflows/cf-deploy.yml"]
  workflow_dispatch:
jobs:
  deploy-api: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4},{uses: actions/setup-node@v4, with:{node-version: 20}},{run: npm ci || npm install},{uses: cloudflare/wrangler-action@v3, with:{apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}", accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", command: "deploy --config apps/api-main/wrangler.toml"}}]}
  deploy-search: {runs-on: ubuntu-latest, needs: deploy-api, steps: [{uses: actions/checkout@v4},{uses: actions/setup-node@v4, with:{node-version: 20}},{run: npm ci},{uses: cloudflare/wrangler-action@v3, with:{apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}", accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", command: "deploy --config apps/search-service/wrangler.toml"}}]}
  deploy-web: {runs-on: ubuntu-latest, needs: [deploy-api, deploy-search], steps: [{uses: actions/checkout@v4},{uses: actions/setup-node@v4, with:{node-version: 20}},{run: npm ci},{run: npm run build:worker --workspace=@foodleap/web},{uses: cloudflare/wrangler-action@v3, with:{apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}", accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", command: "deploy --config apps/web/wrangler.toml"}}]}
